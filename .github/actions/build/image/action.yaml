name: 'Build image'

inputs:
  DOCKER_USERNAME:
    required: false
  DOCKER_TOKEN:
    required: false
  LOAD:
    required: false
    default: 'false'
  PACKAGE:
    required: true
  PLATFORMS:
    required: true
  PUSH:
    required: false
    default: 'false'
  REGISTRY:
    required: false
    default: ''
  TAGS:
    required: true

runs:
  using: 'composite'

  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to registry
      if: inputs.PUSH == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_TOKEN }}

    - name: Build image from package
      uses: docker/build-push-action@v7
      with:
        context: docker
        push: ${{ inputs.PUSH }}
        load: ${{ inputs.LOAD }}
        tags: ${{ inputs.TAGS }}
        platforms: ${{ inputs.PLATFORMS }}
        build-args: |
          PACKAGE=${{ inputs.PACKAGE }}
