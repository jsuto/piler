name: Build and test

on:
  pull_request:
    types:
      - opened # PR created
      - synchronize # commit pushed to PR
      - reopened # closed PR reopened

concurrency:
  group: ${{ github.ref_name == 'master' && 'master' || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

env:
  ARCHIVE_HOST: test1.wadzu.com
  IMAGE_NAME: sutoj/piler
  TEST_TAG: test
  DISTRO: resolute
  PROJECT_ID: piler
  ARCH: arm64
  CONTAINER: piler
  RT: 1

jobs:
  get-version:
    runs-on:
      - ubuntu-latest

    outputs:
      IMAGE_TAG: ${{ steps.get-version.outputs.IMAGE_TAG }}
      COMMIT_ID: ${{ steps.get-version.outputs.COMMIT_ID }}
      VERSION: ${{ steps.get-version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            VERSION
            .github
          sparse-checkout-cone-mode: false

      - name: Get version
        id: get-version
        uses: ./.github/actions/version

  build-package:
    needs:
      - get-version

    runs-on:
      - ubuntu-24.04-arm

    outputs:
      PACKAGE: ${{ steps.build-package.outputs.PACKAGE }}

    steps:
      - uses: actions/checkout@v6

      - name: Build package
        id: build-package
        uses: ./.github/actions/build/package
        with:
          ARCH: ${{ env.ARCH }}
          COMMIT_ID: ${{ needs.get-version.outputs.COMMIT_ID }}
          DISTRO: ${{ env.DISTRO }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          VERSION: ${{ needs.get-version.outputs.VERSION }}

  build-image:
    runs-on:
      - ubuntu-24.04-arm

    needs:
      - get-version
      - build-package

    steps:
      - uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: package-${{ env.ARCH }}
          path: docker

      - name: Build image
        uses: ./.github/actions/build/image
        with:
          TAGS: ${{ env.IMAGE_NAME }}:${{ env.TEST_TAG }}
          LOAD: 'true'
          PACKAGE: ${{ env.PROJECT_ID }}_${{ needs.get-version.outputs.VERSION }}-${{ env.DISTRO }}-${{ needs.get-version.outputs.COMMIT_ID }}
          PLATFORMS: 'linux/arm64'
          PUSH: 'false'

  # Requires the EML corpus in /opt/tests/eml and /usr/local/bin/smtp-source.py
  # on the runner; neither is part of this repository. Set the RUN_E2E_TESTS
  # repo variable to 'true' once a runner provides them.
  run-tests:
    if: vars.RUN_E2E_TESTS == 'true'

    runs-on:
      - ubuntu-24.04-arm

    needs:
      - build-image

    steps:
      - name: Run tests
        uses: ./.github/actions/test
        with:
          ARCHIVE_HOST: ${{ env.ARCHIVE_HOST }}
          CONTAINER: 'piler'
          TEST_TAG: ${{ env.TEST_TAG }}
